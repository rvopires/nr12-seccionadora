<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste da capa animada</title>
<style>
html,body{margin:0;height:100%;background:#0A1330}
.stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;margin:0 auto;overflow:hidden;top:50%;transform:translateY(-50%)}
.stage img{position:absolute;inset:0;width:100%;height:100%;display:block}
.g{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen}
.led{width:2.2%;height:3.9%;background:radial-gradient(closest-side,rgba(110,255,150,.9),rgba(110,255,150,0));animation:blink 1.8s steps(1) infinite}
.led.l1{left:91%;top:38.5%}.led.l2{left:91%;top:43.5%;animation-delay:.6s;animation-duration:2.3s}.led.l3{left:91%;top:48.5%;animation-delay:1.1s}
.sign{left:63%;top:9%;width:18%;height:22%;background:radial-gradient(closest-side,rgba(130,235,90,.3),rgba(130,235,90,0));animation:pulse 3s ease-in-out infinite}
.lamp{width:7%;height:9%;background:radial-gradient(closest-side,rgba(255,255,230,.45),rgba(255,255,230,0));animation:pulse 4s ease-in-out infinite}
.lamp.a{left:62.5%;top:3%}.lamp.b{left:69.5%;top:3%;animation-delay:.9s}.lamp.c{left:77.5%;top:2%;animation-delay:1.7s}
.neon{left:47%;top:-3%;width:12%;height:11%;background:radial-gradient(closest-side,rgba(255,110,230,.5),rgba(255,110,230,0));animation:pulse 2.6s ease-in-out infinite}
.floor{left:25%;top:74%;width:42%;height:24%;background:radial-gradient(closest-side,rgba(255,110,200,.4),rgba(255,110,200,0));animation:pulse 3.4s ease-in-out infinite}
.floor.b{left:8%;top:78%;width:28%;height:20%;background:radial-gradient(closest-side,rgba(90,150,255,.4),rgba(90,150,255,0));animation-delay:1.2s}
.bk{border-radius:50%;background:radial-gradient(closest-side,rgba(60,150,255,.6),rgba(60,150,255,0));animation:pulse 5s ease-in-out infinite}
.bk.k1{left:1%;top:-1%;width:10%;height:17%}.bk.k2{left:6%;top:6%;width:9%;height:15%;animation-delay:1s}.bk.k3{left:11%;top:2%;width:9%;height:15%;animation-delay:2s}.bk.k4{left:.5%;top:14%;width:9%;height:15%;animation-delay:3s}
.fog{left:-10%;top:30%;width:50%;height:70%;background:radial-gradient(closest-side,rgba(80,120,255,.22),rgba(80,120,255,0));animation:drift 14s ease-in-out infinite alternate}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@keyframes blink{0%,60%{opacity:1}61%,75%{opacity:.15}76%,100%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6%,-4%) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.g{animation:none}}
</style></head><body>
<div class="stage" id="st">
<img src="assets/fotos/capa.png" alt="">
<div class="g fog"></div>
<div class="g bk k1"></div><div class="g bk k2"></div><div class="g bk k3"></div><div class="g bk k4"></div>
<div class="g neon"></div><div class="g lamp a"></div><div class="g lamp b"></div><div class="g lamp c"></div><div class="g sign"></div>
<div class="g led l1"></div><div class="g led l2"></div><div class="g led l3"></div>
<div class="g floor"></div><div class="g floor b"></div>
<canvas id="c"></canvas>
</div>
<script>
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,P=[];
function size(){var r=cv.getBoundingClientRect();W=cv.width=r.width;H=cv.height=r.height}
size();addEventListener('resize',size);
function mk(i){var gold=Math.random()<.65;return{x:Math.random(),y:Math.random(),r:(gold?1.2:2.4)*(.6+Math.random()),vx:(Math.random()-.5)*.012,vy:-.01-Math.random()*.02,a:Math.random()*6.28,c:gold?'255,205,110':'255,143,177',bk:!gold&&Math.random()<.5}}
for(var i=0;i<70;i++)P.push(mk(i));
var last=0;
function f(t){var dt=Math.min((t-last)/1000,.05);last=t;ctx.clearRect(0,0,W,H);
 P.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=dt*1.5;if(p.y<-.05){p.y=1.05;p.x=Math.random()}if(p.x<-.05)p.x=1.05;if(p.x>1.05)p.x=-.05;
  var al=.35+.35*Math.sin(p.a),s=H/941*p.r*(p.bk?2.2:1);
  ctx.beginPath();ctx.fillStyle='rgba('+p.c+','+(p.bk?al*.5:al)+')';ctx.arc(p.x*W,p.y*H,s,0,6.28);ctx.fill()});
 requestAnimationFrame(f)}
requestAnimationFrame(f);
</script></body></html>
